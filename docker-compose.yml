volumes:
  mongodb_data:

services:
  backend:
    build:
      context: ./backend
      target: builder
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      target: builder
    env_file:
      - ./.env
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run worker:start
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: builder
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL_CLIENT=http://localhost:5000/api
      - NEXT_PUBLIC_API_BASE_URL_SERVER=http://backend:5000/api
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev
    depends_on:
      - backend

  mongo:
    image: mongo:6.0
    container_name: imsys-mongo
    hostname: imsys-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-entrypoint.sh:/usr/local/bin/mongo-entrypoint.sh
    entrypoint: [ "/usr/local/bin/mongo-entrypoint.sh" ]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "rs.status().ok && rs.status().myState == 1 ? quit(0) : quit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - /var/lib/redis:/data
    command: redis-server --save 20 1 --loglevel warning